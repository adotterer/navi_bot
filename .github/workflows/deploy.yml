name: Deploy to Elastic Beanstalk

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Create deployment package
        run: |
          zip -r navi_bot.zip . -x "node_modules/*" ".git/*" ".gitignore"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: navi-bot
          environment_name: navi-bot-env-1
          region: us-west-1
          version_label: v-${{ github.sha }}
          deployment_package: navi_bot.zip

      - name: Notify Discord audit-logs
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          sleep 20
          PAYLOAD=$(jq -n \
            --arg ref "refs/heads/main" \
            --arg sha "${{ github.sha }}" \
            --arg msg "${{ github.event.head_commit.message }}" \
            --arg author "${{ github.event.head_commit.author.name }}" \
            '{ref: $ref, head_commit: {id: $sha, message: $msg, author: {name: $author}}}')
          SIG="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $2}')"
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://navi.adotterer.com/github/webhook \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIG" \
            -d "$PAYLOAD"
